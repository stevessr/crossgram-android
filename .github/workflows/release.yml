name: Build and publish Crossgram APKs

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'src/**'
      - 'scripts/ci/**'
      - 'features/**'
      - 'assets/branding/**'
      - 'tests/**'
      - 'package.json'
      - 'yarn.lock'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish one unified GitHub Release
        type: boolean
        default: true
      client:
        description: Clients to build (use all for a unified release)
        type: choice
        default: all
        options:
          - all
          - nagram
          - telegram
          - nnngram
          - nullgram
          - mercurygram
          - forkgram
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: crossgram-upstream-release-${{ github.event_name == 'pull_request' && github.head_ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      clients: ${{ steps.matrix.outputs.clients }}
      build: ${{ steps.matrix.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Yarn 4's global package cache is not the classic Yarn 1 cache folder.
      # Share immutable package archives across discovery, tests and builds.
      - name: Restore Yarn 4 package cache
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn4-${{ runner.os }}-node24-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn4-${{ runner.os }}-node24-
      - run: corepack enable && yarn install --immutable
      - id: matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CROSSGRAM_CLIENT: ${{ inputs.client || 'all' }}
        run: yarn discover --github-output "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    name: Patcher unit and harness tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Yarn 4's global package cache is not the classic Yarn 1 cache folder.
      # Share immutable package archives across discovery, tests and builds.
      - name: Restore Yarn 4 package cache
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn4-${{ runner.os }}-node24-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn4-${{ runner.os }}-node24-
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: corepack enable && yarn install --immutable
      # The suite compiles the injected helpers and drives the patch anchors, so
      # a drifted upstream anchor fails here instead of after the native build.
      - run: yarn check
      - name: Validate release scripts
        run: |
          bash -n scripts/ci/build-upstream.sh
          python3 -m py_compile scripts/ci/release-manifest.py

  build:
    needs:
      - discover
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      # Native compilation dominates the six-brand build. Keep a bounded,
      # compressed cache per client / ABI / NDK; never cache patched trees,
      # keystores, local.properties or APK intermediates.
      CCACHE_MAXSIZE: 750M
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "3"
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover.outputs.build) }}
    name: ${{ matrix.id }} · ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Yarn 4's global package cache is not the classic Yarn 1 cache folder.
      # Share immutable package archives across discovery, tests and builds.
      - name: Restore Yarn 4 package cache
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: yarn4-${{ runner.os }}-node24-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn4-${{ runner.os }}-node24-
      - uses: android-actions/setup-android@v4
      - name: Install client NDK
        env:
          NDK_VERSION: ${{ matrix.ndkVersion }}
          NATIVE_DEPS_NDK_VERSION: ${{ matrix.nativeDepsNdkVersion }}
          TDLIB_NDK_VERSION: ${{ matrix.tdlibNdkVersion }}
        run: |
          packages=("ndk;$NDK_VERSION" "cmake;3.22.1")
          if [[ -n "$NATIVE_DEPS_NDK_VERSION" ]]; then
            packages+=("ndk;$NATIVE_DEPS_NDK_VERSION")
          fi
          if [[ -n "$TDLIB_NDK_VERSION" ]]; then
            packages+=("ndk;$TDLIB_NDK_VERSION")
          fi
          (yes || true) | sdkmanager --install "${packages[@]}"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install native tools
        run: bash scripts/ci/install-native-tools.sh
      - name: Install Rust Android targets
        # Forkgram builds its tlottie archives from Rust sources and refuses to
        # configure until all four Android targets are installed.
        if: matrix.id == 'forkgram'
        run: >-
          rustup target add
          aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      # Cache archives are immutable: using a fixed key stops ccache from
      # improving after the first run. Restore the newest compatible snapshot
      # and always save new compiler results under a per-run key.
      - name: Restore C and C++ compiler cache
        id: ccache
        uses: actions/cache/restore@v6
        with:
          path: .cache/ccache
          key: ccache-v2-${{ runner.os }}-${{ matrix.id }}-${{ matrix.variant }}-${{ matrix.ndkVersion }}-${{ matrix.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v2-${{ runner.os }}-${{ matrix.id }}-${{ matrix.variant }}-${{ matrix.ndkVersion }}-${{ matrix.ref }}-
            ccache-v2-${{ runner.os }}-${{ matrix.id }}-${{ matrix.variant }}-${{ matrix.ndkVersion }}-
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - run: corepack enable && yarn install --immutable
      - name: Reset compiler cache statistics
        run: ccache --zero-stats
      - name: Patch and build six branded APKs
        env:
          CROSSGRAM_BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          CROSSGRAM_KEYSTORE_BASE64: ${{ secrets.CROSSGRAM_KEYSTORE_BASE64 }}
          CROSSGRAM_KEYSTORE_PASSWORD: ${{ secrets.CROSSGRAM_KEYSTORE_PASSWORD }}
          CROSSGRAM_KEY_ALIAS: ${{ secrets.CROSSGRAM_KEY_ALIAS }}
          CROSSGRAM_KEY_PASSWORD: ${{ secrets.CROSSGRAM_KEY_PASSWORD }}
          CROSSGRAM_TELEGRAM_API_ID: ${{ secrets.CROSSGRAM_TELEGRAM_API_ID }}
          CROSSGRAM_TELEGRAM_API_HASH: ${{ secrets.CROSSGRAM_TELEGRAM_API_HASH }}
        run: >-
          bash scripts/ci/build-upstream.sh
          "${{ matrix.id }}"
          "${{ matrix.repository }}"
          "${{ matrix.ref }}"
          "${{ matrix.version }}"
          "${{ matrix.variant }}"
          "${{ matrix.gradleTask }}"
          "${{ matrix.ndkVersion }}"
          "${{ matrix.nativeDepsNdkVersion }}"
      - name: Report compiler cache statistics
        if: always()
        env:
          RESTORED_CCACHE_KEY: ${{ steps.ccache.outputs.cache-matched-key }}
        run: |
          ccache --show-stats --verbose
          {
            printf '### C/C++ cache: %s / %s\n\n' "${{ matrix.id }}" "${{ matrix.variant }}"
            printf 'Restored snapshot: `%s`\n\n' "${RESTORED_CCACHE_KEY:-cold cache}"
            echo '```text'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Run-specific save keys ensure even failed builds can contribute usable
      # compiler objects to the next run without caching signing credentials.
      - name: Save refreshed C and C++ compiler cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Upload qq APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.id }}-${{ matrix.variant }}-qq
          path: artifacts/${{ matrix.id }}/${{ matrix.variant }}/qq/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload wechat APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.id }}-${{ matrix.variant }}-wechat
          path: artifacts/${{ matrix.id }}/${{ matrix.variant }}/wechat/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload wecom APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.id }}-${{ matrix.variant }}-wecom
          path: artifacts/${{ matrix.id }}/${{ matrix.variant }}/wecom/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload dingtalk APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.id }}-${{ matrix.variant }}-dingtalk
          path: artifacts/${{ matrix.id }}/${{ matrix.variant }}/dingtalk/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload discord APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.id }}-${{ matrix.variant }}-discord
          path: artifacts/${{ matrix.id }}/${{ matrix.variant }}/discord/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload matrix APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.id }}-${{ matrix.variant }}-matrix
          path: artifacts/${{ matrix.id }}/${{ matrix.variant }}/matrix/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: ${{ always() && (github.event_name == 'schedule' || inputs.publish) }}
    permissions:
      contents: write
    needs: [discover, build]
    runs-on: ubuntu-latest
    name: Publish one unified release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          path: release-assets
          merge-multiple: true
      - name: Publish all successful clients and architectures
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENTS_JSON: ${{ needs.discover.outputs.clients }}
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          shopt -s nullglob
          apks=(release-assets/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "No successful artifacts; skipping release."
            exit 0
          fi

          tag="crossgram-${GITHUB_RUN_NUMBER}"
          {
            echo "Unified Crossgram Android build from workflow run ${GITHUB_RUN_NUMBER}."
            echo
            echo "Included upstream revisions:"
            printf '%s' "$CLIENTS_JSON" | jq -r '.[] | "- \(.id): `\(.ref)` from \(.repository)"'
            echo
            echo "Available 64-bit APKs are attached separately by client, ABI and brand (QQ, WeChat, WeCom, DingTalk, Discord, Matrix). A failed brand build may leave earlier successful brand artifacts."
          } > release-notes.md

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Crossgram Android #${GITHUB_RUN_NUMBER}" \
              --notes-file release-notes.md
          fi
          # The patched clients read this manifest instead of their upstream
          # release feeds: it maps "client + ABI variant + brand" to the exact
          # APK asset of this release, with the hash of the installed APK as the
          # only version signal.
          # GitHub rewrites characters such as "(" in asset names, so the APKs are
          # renamed to their published spelling before the manifest records the
          # download URLs; otherwise the clients would be sent to 404s.
          python3 scripts/ci/release-manifest.py release-assets "$REPOSITORY" "$RUN_NUMBER" release-notes.md

          files=(release-assets/*.apk release-assets/*.txt release-assets/crossgram-update.json)

          gh release upload "$tag" "${files[@]}" --clobber

